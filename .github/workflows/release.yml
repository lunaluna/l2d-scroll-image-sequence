name: Release

# 素のバージョン番号のタグ(例 1.0.0. v は付けない)を push すると、検査とテストのあとで、
# 配布の ZIP(l2d-scroll-image-sequence.{版}.zip)を作って GitHub Release にする.
# ZIP は作業ツリーを .distignore で絞って作る. build/ はコミットしたものがそのまま入る(ここではビルドしない).
# 外部の Actions はコミットの SHA で固定する(行末の # は版). 版は ci.yml と同じ.

on:
  push:
    tags:
      - '[0-9]*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. 1.0.0)'
        required: false

permissions:
  contents: write

jobs:
  verify-pot-version:
    # languages/l2d-scroll-image-sequence.pot の Project-Id-Version は "<製品名> <版>\n" の形で、
    # 共有の verify-version action では切り出せないので、ここで確かめる(forced-auto-update-controller と同じ).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Resolve release version
        id: resolve
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          if [ -z "$TAG" ]; then
            echo "::error::タグを解決できませんでした(workflow_dispatch では tag 入力が必須です)"
            exit 1
          fi
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Verify .pot Project-Id-Version matches the release version
        run: |
          VERSION="${{ steps.resolve.outputs.version }}"
          FILE="languages/l2d-scroll-image-sequence.pot"
          POT_VERSION=$(grep -E '^"Project-Id-Version:' "$FILE" \
            | head -n1 | sed -E 's/.*[[:space:]]([0-9][0-9.]*)\\n"$/\1/')
          echo "$FILE Project-Id-Version: $POT_VERSION"
          echo "Release version: $VERSION"
          if [ "$POT_VERSION" != "$VERSION" ]; then
            echo "::error::$FILE の Project-Id-Version ($POT_VERSION) がリリースバージョン ($VERSION) と一致しません"
            exit 1
          fi

  tests:
    # タグを打てば CI の結果に関係なくリリースが出てしまうので、CI と同じ検査とテストをここでも行い、機械的に止める.
    name: Tests (PHPCS / PHPStan / PHPUnit)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.1'
          extensions: zip
          coverage: none

      - name: Install Composer dependencies
        uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0

      - name: Run PHPCS
        run: vendor/bin/phpcs --standard=phpcs.xml.dist

      - name: Run PHPStan
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G

      - name: Run PHPUnit
        run: vendor/bin/phpunit

  build-check:
    # 配布の ZIP に入る build/ が、src/ からビルドし直したものと同じかを確かめる.
    name: JS / CSS lint and build check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.0'
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Lint JS and CSS
        run: |
          npm run lint:js
          npm run lint:css

      - name: Check that build/ is up to date
        run: |
          npm run build
          git diff --exit-code -- build

  release:
    needs: [ verify-pot-version, tests, build-check ]
    # 共有の reusable workflow. メインファイルの Version: と readme.txt の Stable tag: がタグと一致するかを確かめ、
    # bin/build-zip.sh で ZIP を作り、readme.txt の Changelog の該当の版を説明文にして Release を作る.
    uses: lunaluna/l2d-wp-github-update-lib/.github/workflows/plugin-release.yml@1.3.1
    with:
      slug: l2d-scroll-image-sequence
      version_files: |
        l2d-scroll-image-sequence.php:^[[:space:]]*\*[[:space:]]*Version:
        readme.txt:^Stable tag:
      notes_source: readme.txt
